<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node Server</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4efe6;
        color: #24312d;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 38rem;
        padding: 3rem;
        border: 1px solid #c9bda9;
        background: #fffdf8;
        box-shadow: 12px 12px 0 #d8c9b5;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        font: 1.1rem/1.6 Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Node.js</h1>
      <p>This HTML page is being served by a Node.js HTTP server.</p>
    </main>
  </body>
</html>
